<!doctype html>
<html>
  <head>
    <title></title>
  </head>
  <body>
    <!-- Html Background with Colors -->
    <!-- Format 1 - Use color name -->
    <table bgcolor="yellow" width="100%">
      <tr>
        <td>This background is yellow</td>
      </tr>
    </table>
    <!-- Format 2 - Use hex value -->
    <table bgcolor="#6666FF" width="100%">
      <tr>
        <td>This background is sky blue</td>
      </tr>
    </table>
    <!-- Format 3 - Use color value in RGB terms -->
    <table bgcolor="rgb(255,0,255)" width="100%">
      <tr>
        <td>This background is green</td>
      </tr>
    </table>
    <!-- Html Background with Images -->
    <!-- Set table background -->
    <table background="https://images.pexels.com/photos/5187855/pexels-photo-5187855.jpeg" width="20%" height="100">
      <tr>
        <td>This background is filled up with HTML image.</td>
      </tr>
    </table>
  </body>
</html>
