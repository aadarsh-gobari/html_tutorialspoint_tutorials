<!doctype html>
<html>
  <head>
    <title></title>
  </head>
  <body>
    <!-- HTML LISTS -->
    <!-- 1.ul -:Unordered List-->
    <ul type="square">
      <li>Beetroot</li>
      <li>Ginger</li>
      <li>Potato</li>
      <li>Radish</li>
    </ul>

    <!-- 2.ol -:Ordered List -->
    <ol type="I" start="4">
      <li>Beetroot</li>
      <li>Ginger</li>
      <li>Potato</li>
      <li>Radish</li>
    </ol>

    <!-- 3.dl :-Definition List -->
    <dl>
      <dt><b>HTML</b></dt>
      <dd>This stands for Hyper Text Markup Language</dd>
      <dt><b>HTTP</b></dt>
      <dd>This stands for Hyper Text Transfer Protocol</dd>
    </dl>
  </body>
</html>
