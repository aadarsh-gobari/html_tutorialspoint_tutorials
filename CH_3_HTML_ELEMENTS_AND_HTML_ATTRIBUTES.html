<!doctype html>
<html dir="rtl" lang="en">
  <head>
    <title></title>
  </head>
  <body>
    <!-- Nested Html Elements -->
    <h1>This is <i>italic</i> heading</h1>
    <p>This is <u>underlined</u> paragraph</p>
    <!-- Html Attributes (Name Value pairs) -->
    <p align="left">This is left aligned</p>
    <p align="center">This is center aligned</p>
    <p align="right">This is right aligned</p>
    <!-- Core Attributes (id,class,title,style) -->
    <!-- 1.id Attribute -->
    <p id="html">This para explains what is HTML</p>
    <p id="css">This para explains what is Cascading Style Sheet</p>
    <!-- 2.title Attribute -->
    <h3 title="Hello HTML!">Titled Heading Tag Example</h3>
    <!-- 3.class Attribute -->
    <div class="html">We are learning Html</div>
    <!-- 4.style Attribute -->
    <p style="font-family: arial; color: #ff0000">Some text...</p>

    <!-- Internationalization Attributes(dir,lang,xml:lang)-->
    <!-- 1.dir Attribute(ltr,rtl) -->
    <!-- 2.lang Attribute -->

    <!-- Generic Attributes(align,valign,bgcolor,background,height,width) -->
  </body>
</html>
